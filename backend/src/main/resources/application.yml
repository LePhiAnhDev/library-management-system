spring:
  application:
    name: library
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Load committed backend/.env (KEY=VALUE) as a property source when running locally.
  # Optional so packaged/prod runs that rely on real environment variables still start.
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:library}
    username: ${POSTGRES_USER:library_user}
    password: ${POSTGRES_PASSWORD:library_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: library-pool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Hibernate only validates the mapping against it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  jackson:
    # Jackson 3 (Spring Boot 4 default) already serializes java.time types as ISO-8601 strings.
    default-property-inclusion: non_null
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  clerk:
    secret-key: ${CLERK_SECRET_KEY:}
    api-base-url: https://api.clerk.com/v1
    # Clerk session JWT is validated directly against the JWKS (issuer discovery is bypassed),
    # and the issuer claim is checked explicitly. See SecurityConfig#jwtDecoder.
    issuer-uri: ${CLERK_ISSUER_URI:https://just-drake-18.clerk.accounts.dev}
    jwks-uri: ${CLERK_JWKS_URI:https://just-drake-18.clerk.accounts.dev/.well-known/jwks.json}
  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:}
      region: ${R2_REGION:auto}
      public-base-url: ${R2_PUBLIC_DEV_URL:}
      presigned-url-expire-seconds: ${R2_PRESIGNED_URL_EXPIRE_SECONDS:3600}
